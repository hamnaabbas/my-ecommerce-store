{% load static %}
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Enterprise Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{% static 'store/auth.css' %}">
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="mesh-bg"></div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-6 right-6 z-50 transform translate-y-[-200%] opacity-0 px-6 py-3 rounded-2xl glass-card text-sm font-medium flex items-center space-x-3 shadow-2xl transition-all duration-300">
        <span id="toast-icon"></span>
        <span id="toast-message"></span>
    </div>

    <div class="w-full max-w-md floating-container">
        <div class="glass-card rounded-3xl p-8 md:p-10 relative overflow-hidden" id="auth-card">
            
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 mb-4 shadow-inner">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/></svg>
                </div>
                <h1 class="text-2xl font-bold tracking-tight text-white">Create Account</h1>
                <p class="text-sm text-zinc-400 mt-1">Join our enterprise network today</p>
            </div>

            <form id="signup-form" class="space-y-4" onsubmit="handleSignup(event)">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-2">Full Name</label>
                    <input type="text" id="signup-name" required class="w-full px-4 py-3 rounded-xl glass-input text-sm" placeholder="John Doe">
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-2">Email Address</label>
                    <input type="email" id="signup-email" required class="w-full px-4 py-3 rounded-xl glass-input text-sm" placeholder="name@company.com" oninput="validateEmailRealtime(this)">
                    <p id="signup-email-err" class="text-red-400 text-xs mt-1 hidden">Please enter a valid email format.</p>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-2">Password</label>
                    <div class="relative">
                        <input type="password" id="signup-password" required class="w-full px-4 py-3 rounded-xl glass-input text-sm pr-10" placeholder="••••••••" oninput="checkPasswordStrength(this.value)">
                        <button type="button" onclick="togglePassword('signup-password', this)" class="absolute right-3 top-3.5 text-zinc-400 hover:text-white text-xs">Show</button>
                    </div>
                    <!-- Password Strength Meter -->
                    <div class="flex gap-1 h-1 mt-2">
                        <div id="strength-1" class="flex-1 bg-white/10 rounded-full transition-all"></div>
                        <div id="strength-2" class="flex-1 bg-white/10 rounded-full transition-all"></div>
                        <div id="strength-3" class="flex-1 bg-white/10 rounded-full transition-all"></div>
                    </div>
                    <p id="strength-text" class="text-[10px] text-zinc-500 mt-1">Use 8+ characters with a mix of letters & numbers</p>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-2">Confirm Password</label>
                    <input type="password" id="signup-confirm" required class="w-full px-4 py-3 rounded-xl glass-input text-sm" placeholder="••••••••" oninput="checkPasswordMatch()">
                    <p id="match-err" class="text-red-400 text-xs mt-1 hidden">Passwords do not match</p>
                </div>

                <button type="submit" id="signup-btn" class="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 transition text-white font-medium text-sm flex items-center justify-center space-x-2 shadow-lg shadow-indigo-500/20">
        <span>Create Account</span>
    </button>
            </form>

            <div class="mt-6 text-center">
                <p class="text-sm text-zinc-400">Already have an account? <a href="{% url 'login' %}" class="text-indigo-400 font-medium hover:underline">Sign In</a></p>
            </div>

        </div>
    </div>
 
  
</body>
</html>
