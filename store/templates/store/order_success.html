<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Order Success</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">

    <div class="card shadow-sm p-5 text-center" style="max-width: 500px;">
        <h1 class="text-success mb-3">🎉 Success!</h1>
        <h4>Your order has been placed successfully.</h4>
        <p class="text-muted">Order ID: #{{ order.id }}</p>
        <p>We are processing your shipping address: <strong>{{ order.shipping_address }}</strong></p>
        
        <a href="{% url 'product_list' %}" class="btn btn-primary mt-3">Back to Home</a>
    </div>

</body>
</html>
