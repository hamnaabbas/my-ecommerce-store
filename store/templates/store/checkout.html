<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Checkout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container my-5" style="max-width: 600px;">
        <h2 class="mb-4 text-center">Checkout</h2>
        
        <div class="card shadow-sm p-4">
            <h4 class="mb-3">Total Payable: <span class="text-success">${{ total }}</span></h4>
            
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="address" class="form-label">Shipping Address</label>
                    <textarea class="form-control" id="address" name="address" rows="4" required placeholder="Enter your full street address, city, country..."></textarea>
                </div>
                
                <button type="submit" class="btn btn-success w-100 py-2">Place Order</button>
            </form>
        </div>
    </div>

</body>
</html>
