<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ product.title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container my-5">
        <a href="{% url 'product_list' %}" class="btn btn-secondary mb-4">← Back to Products</a>
        
        <div class="row bg-white p-4 rounded shadow-sm">
            <div class="col-md-6">
                {% if product.image %}
                    <img src="{{ product.image.url }}" class="img-fluid rounded" alt="{{ product.title }}">
                {% else %}
                    <div class="bg-secondary text-white d-flex align-items-center justify-content-center rounded" style="height: 350px;">No Image</div>
                {% endif %}
            </div>
            <div class="col-md-6 d-flex flex-column justify-content-center">
                <h2>{{ product.title }}</h2>
                <h3 class="text-success my-3">${{ product.price }}</h3>
                <p class="text-muted">{{ product.description }}</p>
                <p><strong>Stock Available:</strong> {{ product.stock }}</p>
                
                <a href="{% url 'add_to_cart' product.id %}" class="btn btn-success btn-lg mt-3">Add to Cart 🛒</a>
            </div>
        </div>
    </div>

</body>
</html>
