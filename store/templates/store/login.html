{% load static %}
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Enterprise Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{% static 'store/auth.css' %}">
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="mesh-bg"></div>

    <div class="w-full max-w-md floating-container">
        <div class="glass-card rounded-3xl p-8 md:p-10 relative overflow-hidden">
            
            <div class="text-center mb-8">
                <h1 class="text-2xl font-bold tracking-tight text-white">Welcome back</h1>
                <p class="text-sm text-zinc-400 mt-1">Enter your credentials to access your dashboard</p>
            </div>

            <form method="POST" action="{% url 'login' %}" class="space-y-4">
                {% csrf_token %}
                
                {% if form.errors %}
                    <div class="p-3 rounded-xl bg-red-500/10 border border-red-500/20 text-red-400 text-xs text-center mb-4">
                        Invalid username or password. Please try again.
                    </div>
                {% endif %}

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-2">Username</label>
                    <input type="text" name="username" id="id_username" autocomplete="username" required class="w-full px-4 py-3 rounded-xl glass-input text-sm text-white" placeholder="Enter username">
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-2">Password</label>
                    <input type="password" name="password" id="id_password" autocomplete="current-password" required class="w-full px-4 py-3 rounded-xl glass-input text-sm text-white" placeholder="••••••••">
                </div>

                <button type="submit" class="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 transition text-white font-medium text-sm shadow-lg">
                    Sign In
                </button>
            </form>

            <div class="mt-6 text-center">
                <p class="text-sm text-zinc-400">Don't have an account? <a href="{% url 'signup' %}" class="text-indigo-400 font-medium hover:underline">Create an account</a></p>
            </div>
        </div>
    </div>
</body>
</html>
